services:
  - type: web
    name: aurafind-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEV_SEEDS
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aurafind-db
          property: connectionString

databases:
  - name: aurafind-db
    plan: free
    region: singapore
